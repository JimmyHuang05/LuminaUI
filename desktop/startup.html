<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"><title>LuminaUI</title><style>:root{color-scheme:dark;font:13px system-ui,'Microsoft YaHei',sans-serif}body{margin:0;height:100vh;display:grid;place-items:center;background:#171717;color:#ddd}.panel{max-width:560px;padding:40px;text-align:center}h1{font-size:34px;font-weight:400;letter-spacing:-1px}h1 span{color:#888;font-weight:300}p{color:#999;line-height:1.9}small{display:block;margin-top:30px;color:#666;line-height:1.8}button{font:inherit;cursor:pointer;color:#ddd;background:#303030;border:1px solid #555;border-radius:5px;padding:9px 18px;margin:15px 5px}[hidden]{display:none!important}.loader{height:2px;background:#333;overflow:hidden;margin:30px auto;width:220px}.loader:after{content:'';display:block;background:#aaa;height:100%;width:40%;animation:move 1.6s infinite alternate}@keyframes move{to{transform:translateX(150%)}}@media(prefers-reduced-motion:reduce){.loader:after{animation:none}}/* Hide focus outlines consistently across Lumina controls. */
*:focus,*:focus-visible{outline:none!important;outline-offset:0!important}
</style></head><body><div class="panel"><h1>Lumina<span>UI</span></h1><div class="loader" id="loader"></div><p id="status" role="status">正在连接本地创作空间…</p><div id="actions" hidden><button id="retry">重试连接</button><button id="logs">查看启动日志</button></div><small>关闭窗口后，本地服务会保留，进行中的创作不会中断。</small></div><script src="startup.js"></script></body></html>
