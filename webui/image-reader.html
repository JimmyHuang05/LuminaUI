nvas,#161616);border:1px dashed var(--day-line,#ffffff1c);border-radius:6px;cursor:pointer}.drop.drag{border-color:var(--day-line-strong,#aaa);background:var(--day-surface,#242424)}.drop:has(img:not([hidden])){border-style:solid;border-color:transparent}.drop img{display:block;width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.drop input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}.empty{text-align:center;padding:24px;color:var(--day-secondary,#aaa);pointer-events:none}.empty svg{width:38px;height:38px;display:block;margin:0 auto 24px;color:var(--day-secondary,#777)}.empty b{display:block;font-size:13px;font-weight:400;margin-bottom:12px}.empty span{display:block;font-size:11px;color:var(--day-secondary,#626262);line-height:1.9}.image-actions{position:absolute;bottom:14px;right:14px;background:#252525e8;border:1px solid #ffffff30;border-radius:5px;padding:8px 12px;color:#ddd;font-size:11px;pointer-events:none;opacity:0;transition:opacity .15s}.drop:hover .image-actions,.drop:focus-within .image-actions{opacity:1}.output{flex:1;min-height:0;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:2;padding:24px 28px;scrollbar-width:thin;scrollbar-color:#444 transparent;color:var(--day-ink,#ccc)}.output.placeholder{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--day-secondary,#626262);white-space:normal;font-size:12px}.result-foot{display:flex;justify-content:space-between;gap:10px;min-height:42px;padding:14px 20px;border-top:1px solid var(--day-line,#ffffff0c);color:var(--day-secondary,#777);font-size:10px;flex-shrink:0}.status{font-size:11px;color:var(--day-secondary,#999);padding-top:12px;min-height:28px;overflow-wrap:anywhere;line-height:1.6}.status.error{color:#f1a59c}footer{margin-top:24px;padding:28px 0;border-top:1px solid var(--day-line,#ffffff12);font-size:9px;letter-spacing:1.5px;color:var(--day-secondary,#606060)}.busy .primary svg{animation:spi <div class="page"><header><a class="brand" href="/" aria-label="LuminaUI 主页">Lumina<span>UI</span></a><nav aria-label="导航"><a href="/workbench" target="_blank" rel="noopener">工作台 ↗</a><a href="/resources" target="_blank" rel="noopener">提示词库 ↗</a></nav></header>
<main><section class="intro"><div><p class="eyebrow">THE OBSERVATION</p><h1>图片反推<span> / 图像识别</span></h1></div><p class="intro-note">读懂画面，提取灵感。</p></section><div class="workspace">
<section class="panel image-panel"><div class="panel-head"><h2>参考图片</h2><button type="button" class="text-button" id="remove" hidden>移除图片</button></div>
<label class="drop" id="drop"><div class="empty" id="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg><b>添加图片</b><span>点击、拖放或粘贴 · 最大 20 MB</span></div><img id="preview" alt="待识别的图片" hidden><span class="image-actions" id="replace" hidden>点击更换图片</span><input id="file" type="file" accept="image/jpeg,image/png,image/webp" aria-label="上传图片"></label></section>
<section class="panel result-panel" aria-label="识别结果">
<div class="panel-head result-heading"><h2>中文描述</h2><div class="controls"><div class="model-row"><label for="model">识别模型</label><select id="model"><option value="deepseek">DeepSeek · 云端</option><option value="qwen">Qwen3.5-4B · 本地</option></select></div><div class="model-note" id="model-note">图片将发送至已配置的 DeepSeek 服务。</div></div></div><div id="output" class="output placeholder">等待你的画面</div><div class="result-foot"><div class="result-details"><span id="result-model"></span><span id="result-meta"></span></div><button type="button" class="text-button" id="organize" title="按独立字段整理，并生成标题、摘要及分级" hidden>整理为提示词</button><button type="button" class="text-button" id="copy" disabled>复制全文</button><button class="primary" id="recognize" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></svg><span id="button-label">开始识别</span></button></div></section>
</div><div class="status" id="status" role="status" aria-live="polite"></div></main><footer>LUMINA — IMAGE OBSERVATION</footer></div>
<div id="prompt-review" hidden><iframe id="prompt-review-frame" title="检查并保存提示词"></iframe></div>
<script>
const $=id=>document.getElementById(id);let selected=null,url='',pending=false,token='',result='';
async function config(){const r=await fetch('/api/config');if(!r.ok)throw Error('无法连接服务，请刷新重试');token=(await r.json()).token;}
function notice(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error);}
function setImage(file){if(pending)return;if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)){notice('请选择 JPG、PNG 或 WebP 图片',true);return;}if(file.size>20*1024*1024){notice('图片不能超过20MB',true);return;}if(url)URL.revokeObjectURL(url);selected=file;url=URL.createObjectURL(file);$('preview').src=url;$('preview').hidden=false;$('empty').hidden=true;$('replace').hidden=false;$('remove').hidden=false;$('recognize').disabled=false;resetResult();notice('');}
function resetResult(){$('saved-draft-actions')?.remove();result='';promptDraft=null;$('organize').hidden=true;$('organize').textContent='整理为提示词';$('output').textContent='等待你的画面';$('output').classList.add('placeholder');$('copy').disabled=true;$('result-model').textContent='';$('result-meta').textContent='';}
$('file').onchange=()=>{if($('file').files[0])setImage($('file').files[0]);$('file').value='';};
$('remove').onclick=()=>{if(pending)return;selected=null;if(url)URL.revokeObjectURL(url);url='';$('preview').removeAttribute('src');$('preview').hidden=true;$('empty').hidden=false;$('replace').hidden=true;$('remove').hidden=true;$('recognize').disabled=true;resetResult();notice('');};
for(const name of ['dragenter','dragover'])$('drop').addEventListener(name,e=>{e.preventDefault();if(!pending)$('drop').classList.add('drag');});
for(const name of ['dragleave','drop'])$('drop').addEventListener(name,e=>{e.preventDefault();$('drop').classList.remove('drag');if(name==='drop'&&e.dataTransfer.files[0])setImage(e.dataTransfer.files[0]);});
document.addEventListener('paste',e=>{const file=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'))?.getAsFile();if(file){e.preventDefault();setImage(file);}});
$('model').onchange=()=>{$('model-note').textContent=$('model').value==='qwen'?'图片在本机识别。首次加载需要一些时间；生图任务完成后开始。':'图片将发送至已配置的 DeepSeek 服务。';};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(result);notice('已复制');}catch{notice('复制失败，请选中文字后手动复制',true);}};
$('recognize').onclick=async()=>{if(pending||!selected)return;pending=true;const provider=$('model').value;for(const id of ['file','model','remove','recognize','organize'])$(id).disabled=true;document.body.classList.add('busy');$('button-label').textContent='正在识别';$('output').setAttribute('aria-busy','true');notice(provider==='qwen'?'本地 Qwen 正在加载或识别，请稍候…':'DeepSeek 正在识别…');try{if(!token)await config();const form=new FormData();form.append('image',selected);const r=await fetch('/api/image-reader?model='+provider,{method:'POST',headers:{'X-App-Token':token},body:form});let data;try{data=await r.json();}catch{throw Error('服务返回异常，请刷新后重试');}if(!r.ok)throw Error(data.error||'识别失败');if(typeof data.text!=='string'||!data.text.trim())throw Error('模型未返回描述');result=data.text;$('saved-draft-actions')?.remove();promptDraft=null;$('organize').hidden=false;$('organize').textContent='整理为提示词';$('output').textContent=result;$('output').classList.remove('placeholder');$('copy').disabled=false;$('result-model').textContent=data.model;$('result-meta').textContent=result.length+' 字 · '+data.seconds+' 秒';notice('识别完成');}catch(error){notice(error.message,true);}finally{pending=false;for(const id of ['file','model','remove','recognize','organize'])$(id).disabled=false;document.body.classList.remove('busy');$('button-label').textContent='开始识别';$('output').removeAttribute('aria-busy');}};

let promptDraft=null,reviewKey='';
async function promptRequest(path,body){if(!token)await config();const isForm=body instanceof FormData;const response=await fetch(path,{method:'POST',headers:{'X-App-Token':token,...(isForm?{}:{'Content-Type':'application/json'})},body:isForm?body:JSON.stringify(body)});let data;try{data=await response.json();}catch{throw Error('服务返回异常，请重试');}if(!response.ok)throw Error(data.error||'操作失败');return data;}
function reviewPrompt(){
  const bytes=crypto.getRandomValues(new Uint8Array(12));reviewKey=Array.from(bytes,n=>n.toString(16).padStart(2,'0')).join('');
  sessionStorage.setItem('lumina-reader-draft:'+reviewKey,JSON.stringify({...promptDraft.row,source_label:'图片反推'}));
  $('prompt-review-frame').src=(location.protocol==='file:'?'index.html':'/workbench')+'?reader_draft='+reviewKey;$('prompt-review').hidden=false;document.body.classList.add('reviewing');
}
window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==$('prompt-review-frame').contentWindow||!['reader-draft-closed','reader-draft-error','reader-draft-saved'].includes(event.data?.type))return;
  if(event.data.type==='reader-draft-saved'){if(promptDraft&&event.data.row?.id){promptDraft.row=event.data.row;let actions=$('saved-draft-actions');if(!actions){actions=document.createElement('div');actions.id='saved-draft-actions';actions.className='creation-next-actions';$('organize').before(actions);}actions.replaceChildren();for(const [label,path] of [['带入工作台','workbench'],['查看提示词','resources']]){const link=document.createElement('a');link.className='creation-next-link';link.textContent=label+' ↗';link.href=(location.protocol==='file:'?(path==='workbench'?'index.html':'resources.html'):'/'+path)+'?prompt_id='+encodeURIComponent(event.data.row.id);link.target='_blank';link.rel='noopener';actions.append(link);}}return;}
  $('prompt-review').hidden=true;$('prompt-review-frame').removeAttribute('src');document.body.classList.remove('reviewing');sessionStorage.removeItem('lumina-reader-draft:'+reviewKey);reviewKey='';$('organize').focus();
  if(event.data.type==='reader-draft-error')notice(event.data.message||'草稿打开失败，请重试',true);
});
$('organize').onclick=async()=>{
  if(pending||!result||!selected)return;
  if(promptDraft?.row){try{reviewPrompt();}catch(error){notice('无法打开草稿：'+error.message,true);}return;}
  pending=true;for(const id of ['file','model','remove','recognize','organize'])$(id).disabled=true;$('organize').setAttribute('aria-busy','true');
  promptDraft=promptDraft||{};
  try{
    if(!promptDraft.prompt){$('organize').textContent='正在整理…';notice('正在按分类与独立字段整理正文…');const data=await promptRequest('/api/enhance-prompt',{task:'format',prompt:result});if(typeof data.prompt!=='string'||!data.prompt.trim())throw Error('未返回整理后的正文');promptDraft.prompt=data.prompt;}
    if(!promptDraft.metadata){$('organize').textContent='正在更新…';notice('正在生成标题、摘要和分级…');promptDraft.metadata=await promptRequest('/api/enhance-prompt',{task:'update',prompt:promptDraft.prompt});}
    if(!promptDraft.cover_id){$('organize').textContent='准备封面…';const form=new FormData();form.append('image',selected);const cover=await promptRequest('/api/prompt-covers/upload',form);if(!/^[a-f0-9]{32}$/.test(cover.cover_id||''))throw Error('封面保存失败');promptDraft.cover_id=cover.cover_id;}
    promptDraft.row={...promptDraft.metadata,prompt:promptDraft.prompt,cover_id:promptDraft.cover_id,tags:[],mode:'01_text_to_image'};
    notice('草稿已准备好，请检查后保存。');reviewPrompt();
  }catch(error){notice(error.message+'；识图描述已保留。',true);}
  finally{pending=false;for(const id of ['file','model','remove','recognize','organize'])$(id).disabled=false;$('organize').removeAttribute('aria-busy');$('organize').textContent=promptDraft?.row?'查看提示词草稿':'整理为提示词';}
};

config().catch(e=>notice(e.message,true));

// Same trigger and popup treatment as the workbench; retain the native value for requests.
(() => {
  const select=$('model'),wrap=document.createElement('div'),button=document.createElement('button');
  wrap.className='comfy-select';select.after(wrap);select.classList.add('comfy-native-select');select.setAttribute('aria-hidden','true');select.tabIndex=-1;
  button.type='button';button.id='model-trigger';button.className='comfy-select-trigger';button.setAttribute('role','combobox');button.setAttribute('aria-label','识别模型');button.setAttribute('aria-haspopup','listbox');button.setAttribute('aria-expanded','false');wrap.append(button);document.querySelector('label[for="model"]').htmlFor=button.id;
  let popup=null;
  function close(focus=false){if(!popup)return;popup.remove();popup=null;button.setAttribute('aria-expanded','false');button.removeAttribute('aria-controls');if(focus)button.focus();}
  function sync(){button.textContent=select.selectedOptions[0]?.textContent||'';button.disabled=select.disabled;button.title=$('model-note').textContent;if(select.disabled)close();}
  function open(){if(button.disabled)return;if(popup){close();return;}popup=document.createElement('div');popup.className='comfy-popup';popup.id='model-options';popup.setAttribute('role','listbox');popup.setAttribute('aria-label','识别模型');button.setAttribute('aria-controls',popup.id);button.setAttribute('aria-expanded','true');
    for(const option of select.options){const row=document.createElement('button');row.type='button';row.setAttribute('role','option');row.setAttribute('aria-selected',String(option.selected));row.textContent=option.textContent;row.disabled=option.disabled;row.onclick=()=>{select.value=option.value;select.dispatchEvent(new Event('change',{bubbles:true}));sync();close(true);};popup.append(row);}
    document.body.append(popup);const rect=button.getBoundingClientRect();popup.style.width=rect.width+'px';const box=popup.getBoundingClientRect();popup.style.left=Math.max(8,Math.min(rect.left,innerWidth-box.width-8))+'px';popup.style.top=Math.max(8,rect.bottom+box.height+5>innerHeight?rect.top-box.height-5:rect.bottom+5)+'px';
    const items=[...popup.querySelectorAll('button:not(:disabled)')];(popup.querySelector('[aria-selected=true]')||items[0])?.focus();
    popup.onkeydown=e=>{const i=items.indexOf(document.activeElement);if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();items[e.key==='Home'?0:e.key==='End'?items.length-1:(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length]?.focus();}if(e.key==='Escape'){e.preventDefault();close(true);}if(e.key==='Tab')close(true);};
  }
  button.onclick=open;button.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();open();}};
  select.addEventListener('change',sync);new MutationObserver(sync).observe(select,{attributes:true,attributeFilter:['disabled'],childList:true,subtree:true});
  document.addEventListener('pointerdown',e=>{if(popup&&!popup.contains(e.target)&&!wrap.contains(e.target))close();});window.addEventListener('resize',()=>close());document.addEventListener('scroll',e=>{if(popup&&!popup.contains(e.target))close();},true);sync();
})();
</script></body></html>
