<style>:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:var(--day-canvas,#151515);color:var(--day-ink,#e8e7e3)}
*{box-sizing:border-box}
body{margin:0}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit;background:var(--day-surface,#242424);border:1px solid var(--day-line,#444);border-radius:6px;padding:10px 14px}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid #c8b99b;outline-offset:3px}
header{padding:24px 4vw;border-bottom:1px solid var(--day-line,#333);display:flex;justify-content:space-between;gap:20px}
nav{display:flex;gap:24px;color:var(--day-secondary,#aaa);font-size:14px}
main{padding:36px 4vw}
.eyebrow{color:#a69b87;font-size:10px;letter-spacing:3px}
h1{font-weight:400;font-size:38px;margin:10px 0}
p{color:var(--day-secondary,#999);font-size:13px}
.toolbar{display:flex;gap:12px;margin:26px 0}
input{flex:1;max-width:600px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));grid-auto-rows:8px;gap:18px;align-items:start}
.card{display:inline-block;width:100%;padding:0;margin:0;overflow:hidden;align-self:start;text-align:left;border-color:var(--day-line,#303030)}
.card img{display:block;width:100%;height:auto;min-height:80px;background:var(--day-surface,#202020)}
.caption{padding:12px;display:block}
.caption strong{font-size:13px;font-weight:500;display:block}
.caption small{display:block;color:var(--day-secondary,#999);font-size:11px;margin-top:6px}
#more{display:block;margin:24px auto}
#status{padding:10px 0}
dialog::backdrop{background:#000c}
[hidden]{display:none!important}
@media(max-width:700px){header{padding:18px}
nav{gap:12px}
main{padding:24px 18px}
#grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
