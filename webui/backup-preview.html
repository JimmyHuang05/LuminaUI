.card-open{display:block;width:100%;padding:0;border:0;background:none;color:inherit;text-align:left}.card-open:focus-visible{outline:2px solid #bbb;outline-offset:5px}.tag-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.tag{font-size:10px;line-height:1.5;padding:3px 7px;border:1px solid #ffffff16;border-radius:5px;color:#aaa;background:#ffffff04}.source{display:block;margin-top:10px;font-size:11px;color:#aaa;overflow-wrap:anywhere;line-height:1.7}.source a{text-decoration:underline;text-underline-offset:3px}.source a:hover{color:#eee}.meta-empty{font-size:11px;color:#777}</style></head><body><div class="page"><header><a class="brand" href="/" target="_blank" rel="noopener">Lumina<span>UI</span></a><nav><a href="/resources" target="_blank" rel="noopener">当前资源库 ↗</a><a href="/workbench" target="_blank" rel="noopener">工作台 ↗</a></nav></header><section class="intro"><div class="eyebrow">THE ARCHIVE · 2026.10.07</div><h1>提示词备份预览</h1><p class="hint">独立备份快照 · 保留原封面与原始提示词，仅供浏览和复制，不会写入当前资源库。4 条涉及未成年人性内容的记录未纳入预览。</p></section><div class="toolbar"><input id="search" type="search" placeholder="搜索标题、标签、摘要或正文…" aria-label="搜索备份提示词"><select id="rating" aria-label="年龄分级"><option value="">全部分级</option><option value="sfw">G</option><option value="r15">R-15</option><option value="nsfw">R-18</option></select><span id="count" aria-live="polite"></span></div><main id="gallery" class="gallery"></main><p id="empty" class="empty" hidden>没有匹配的提示词</p><footer>来源：Lumina_prompts_and_covers_20261007_131122.zip</footer></div>

<script id="backup-data" type="application/json">__BACKUP_DATA__</script>
<script>
const rows=JSON.parse(document.getElementById('backup-data').textContent),$=id=>document.getElementById(id);let filtered=[],selected=-1,opener;
const labels={'Subject Description':'人物','Clothing & Accessories':'衣着','Action & Pose':'动态','Scene / Background':'场景','Composition / View':'镜头','Lighting & Color':'光线与色彩','Style & Texture':'风格与质感','Essential Constraints':'关键约束'};
const textNode=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
function appendTags(target,row){target.replaceChildren();target.classList.add('tag-list');const tags=Array.isArray(row.tags)?row.tags:[];if(!tags.length){const empty=textNode('span','暂无标签');empty.className='meta-empty';target.append(empty);return}for(const tag of tags){const item=textNode('span',tag);item.className='tag';target.append(item)}}
function appendSource(target,row){target.replaceChildren();target.classList.add('source');const raw=typeof row.source_url==='string'?row.source_url.trim():'';if(!raw){target.textContent='来源：未记录';return}target.append(document.createTextNode('来源：'));try{const url=new URL(raw);if(!['http:','https:'].includes(url.protocol)||url.username||url.password)throw Error();const link=textNode('a',url.hostname+' ↗');link.href=url.href;link.title=raw;link.target='_blank';link.rel='noopener noreferrer';target.append(link)}catch{target.append(document.createTextNode(raw))}}
function render(){const terms=$('search').value.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean),rating=$('rating').value;filtered=rows.filter(row=>(!rating||row.content_rating?.level===rating)&&terms.every(t=>JSON.stringify([row.title,row.tags,row.card_summary,row.module_summaries,row.prompt]).toLocaleLowerCase().includes(t)));$('gallery').replaceChildren();$('count').textContent=filtered.length+' / '+rows.length+' 条';$('empty').hidden=!!filtered.length;filtered.forEach((row,i)=>{const wrapper=document.createElement('div');wrapper.className='card';const card=document.createElement('button');card.className='card-open';card.setAttribute('aria-label','查看：'+row.title);if(row.preview_cover){const img=document.createElement('img');img.src=row.preview_cover;img.alt='';img.loading='lazy';card.append(img)}card.append(textNode('h2',row.title||'未命名提示词'),textNode('p',row.card_summary||''));card.onclick=()=>{opener=card;show(i);$('detail').showModal()};const tags=document.createElement('div'),source=document.createElement('div');appendTags(tags,row);appendSource(source,row);wrapper.append(card,tags,source);$('gallery').append(wrapper)})}
function show(i){selected=i;const row=filtered[i];$('title').textContent=row.title||'未命名提示词';$('cover').hidden=!row.full_cover;if(row.full_cover)$('cover').src=row.full_cover;$('summary').textContent=row.card_summary||'';appendTags($('tags'),row);appendSource($('source'),row);$('position').textContent=(i+1)+' / '+filtered.length+' · 备份快照';$('status').textContent='';$('prev').disabled=i===0;$('next').disabled=i===filtered.length-1;const body=$('body');body.replaceChildren();const text=row.prompt||'',parts=[...text.matchAll(/^\s*\[([^\]\r\n]+)\]\s*\r?\n?/gm)];if(!parts.length)body.append(textNode('p',text));else{if(text.slice(0,parts[0].index).trim())body.append(textNode('p',text.slice(0,parts[0].index)));parts.forEach((m,k)=>{const value=text.slice(m.index+m[0].length,parts[k+1]?.index??text.length).trim();if(value)body.append(textNode('h3',labels[m[1]]||m[1]),textNode('p',value))})}body.scrollTop=0;$('cover').parentElement.scrollTop=0;document.querySelector('.layout').scrollTop=0}
$('search').oninput=render;$('rating').onchange=render;$('prev').onclick=()=>{if(selected>0)show(selected-1)};$('next').onclick=()=>{if(selected<filtered.length-1)show(selected+1)};$('close').onclick=()=>$('detail').close();$('detail').onclose=()=>opener?.focus();$('detail').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&selected>0){e.preventDefault();show(selected-1)}if(e.key==='ArrowRight'&&selected<filtered.length-1){e.preventDefault();show(selected+1)}});$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(filtered[selected].prompt||'');$('status').textContent='已复制'}catch{$('status').textContent='请选中正文手动复制'}};render();
</script></body></html>
