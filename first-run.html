<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首次启动 · LuminaUI</title>
<style>
:root{color-scheme:dark;font:13px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;--gutter:clamp(24px,3.8vw,64px);--header:76px;--ease:cubic-bezier(.22,.68,.12,1);--ink:#f4f3ef}
*{box-sizing:border-box}body{margin:0;background:#171717;color:var(--ink);min-height:100svh;display:grid;grid-template-rows:var(--header) 1fr auto;isolation:isolate}
header,main,footer{width:100%;max-width:1800px;margin:auto;padding-inline:var(--gutter)}
header{height:var(--header);display:flex;justify-content:space-between;align-items:center;z-index:3;color:#e8e7e4}
.wordmark{font-size:22px;font-weight:600;letter-spacing:-1px}.wordmark>span{font-weight:350;color:#919191}
#edition{font-size:11px;letter-spacing:.05em;color:#b6b7b8}
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#141619 0%,transparent 22%,transparent 83%,#16171999);pointer-events:none}
.photo{position:absolute;inset:0 0 0 29%;background:url("docs/images/glass-study.jpg") 50% 49% /cover;mask-image:linear-gradient(90deg,transparent,#000 43%);opacity:.92;transition:transform 1.1s var(--ease),opacity .75s,filter .75s;transform-origin:70% 48%}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:4%;padding-block:clamp(32px,7vh,90px)}
.story{max-width:610px}.count{font-size:12px;letter-spacing:.07em;color:#a8b0b8;font-variant-numeric:tabular-nums}h1{font-size:clamp(42px,5.1vw,86px);font-weight:550;letter-spacing:-.055em;line-height:1.12;margin:22px 0 24px;text-wrap:balance}#copy{font-size:clamp(15px,1.2vw,20px);line-height:1.85;color:#c0c2c5;max-width:31em;margin:0;text-wrap:pretty}
footer{z-index:2;display:flex;align-items:center;justify-content:space-between;padding-block:20px 30px;gap:12px}.dots,nav{display:flex;align-items:center;gap:8px}.dots i{height:3px;width:22px;background:#525457;border-radius:9px;transition:width .4s,background .4s}.dots i.on{background:#dbdede}.dots i.current{width:42px}
button{line-height:1.4;font-family:inherit;font-size:14px;font-weight:600;min-height:46px;padding:10px 24px;border-radius:30px;border:1px solid transparent;color:#151719;background:#ecefe9;cursor:pointer;transition:transform .18s,background .18s}button:hover{transform:translateY(-2px);background:white}button:active{transform:translateY(0)}button:focus-visible{outline:2px solid #a4c4ff;outline-offset:4px}button:disabled{opacity:.65;cursor:wait}#back{background:transparent;color:#c2c5c9}
.art{position:relative;display:grid;place-items:center;min-height:clamp(250px,43vh,570px);pointer-events:none}.art>div{grid-area:1/1;opacity:0;transition:opacity .55s,transform .8s var(--ease);transform:translateY(18px)}
.sample{align-self:end;justify-self:end;font-size:11px;letter-spacing:.06em;color:#efefec;text-shadow:0 1px 12px #000}
.frame{width:min(72%,370px);aspect-ratio:1;border:1px solid #ffffff76;border-radius:3px;box-shadow:0 0 0 6px #ffffff08}.screen{width:100%;padding:7px;background:#3e4149;border:1px solid #777b82;border-radius:12px;box-shadow:0 32px 62px #0006;overflow:hidden}.screen img{width:100%;display:block;border-radius:6px}
body[data-page="0"] .sample,body[data-page="1"] .frame,body[data-page="2"] .screen,body[data-page="3"] .stack{opacity:1;transform:none}
body[data-page="1"] .photo{transform:scale(1.19);filter:saturate(.78)}
body[data-page="2"] .photo,body[data-page="3"] .photo,body[data-page="4"] .photo{opacity:0}
body[data-page="2"] .scene,body[data-page="3"] .scene,body[data-page="4"] .scene{background:radial-gradient(ellipse at 77% 47%,#374454 0%,#21272e 22%,#171717 58%)}
.stack{width:min(68%,300px);aspect-ratio:1;position:relative;display:grid;place-items:center}.stack i{position:absolute;width:74%;height:74%;border-radius:22%;border:1px solid #c2d3ddad;background:linear-gradient(135deg,#c1d6e499,#637683bb 58%,#46515bee);box-shadow:6px 10px 20px #0004;transform:translateY(var(--y)) rotateX(57deg) rotateZ(-38deg);animation:float 4s ease-in-out infinite alternate}.stack i:nth-child(1){--y:22%}.stack i:nth-child(2){--y:1%;animation-delay:-1s}.stack i:nth-child(3){--y:-20%;animation-delay:-2s}@keyframes float{to{transform:translateY(calc(var(--y) - 7px)) rotateX(57deg) rotateZ(-38deg)}}
ul{padding:0;margin:20px 0 0;border-top:1px solid #ffffff25}li{display:flex;justify-content:space-between;padding:10px 0;gap:12px;border-bottom:1px solid #ffffff1a}li span{color:#aab6c2}#notice{color:#c1cdd8;overflow-wrap:anywhere}#notice:empty{display:none}progress{width:100%;height:3px;accent-color:#bed5ef;margin-top:18px}
body[data-page="4"] main{display:block;text-align:center}body[data-page="4"] .story{margin:auto}body[data-page="4"] #copy{margin:auto}body[data-page="4"] .art,body[data-page="4"] footer,body[data-page="4"] .count{display:none}
.seal{display:none}body[data-page="4"] .seal{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 30px;border-radius:50%;background:#cddfd6;color:#1c3431;font-size:30px;box-shadow:0 0 0 10px #cddfd60e,0 0 0 24px #cddfd606;animation:seal .6s var(--ease)}@keyframes seal{from{opacity:0;transform:scale(.8)}}
#enter{margin-top:28px}.leaving main,.leaving .scene,.leaving footer{animation:leave .55s var(--ease) forwards}@keyframes leave{to{opacity:0;transform:translateY(-8px)}}[hidden]{display:none!important}
@media(max-width:1150px){:root{--gutter:28px}}@media(max-width:800px){:root{--gutter:20px}}@media(max-height:780px){:root{--header:58px}}@media(max-height:640px){:root{--header:48px}}
@media(max-width:700px){main{grid-template-columns:1fr;gap:22px;padding-block:22px}.story{max-width:100%}.photo{inset:0;background-position:center 38%;mask-image:linear-gradient(#0009,transparent 78%)}.art{min-height:0}.sample,.frame{display:none}.screen,.stack{display:none}body[data-page="2"] .screen{display:block;width:min(75%,360px)}body[data-page="3"] .stack{display:none}h1{font-size:clamp(40px,9vw,60px)}footer{padding-block:16px}.dots i{width:14px}.dots i.current{width:24px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style><link rel="stylesheet" href="canvas-intro.css"></head><body data-design="canvas">
<header><span class="wordmark">Lumina<span>UI</span></span><span id="edition">Qwen-Image-2.1</span></header>
<div class="scene" aria-hidden="true"><div class="photo"></div></div>
<main><section class="story"><div class="count" id="chapter"></div><div class="seal" aria-hidden="true">✓</div><h1 id="title"></h1><p id="copy"></p>
<div hidden id="resources"><ul><li>Python、PyTorch 与 ComfyUI <span>2.1 GB</span></li><li>主模型、文本编码器与 VAE <span>17.3 GB</span></li><li>文生图工作流 <span>已安装</span></li></ul><progress hidden id="meter" aria-label="当前资源下载进度"></progress></div><p id="notice" role="status" aria-live="polite"></p><button id="enter" hidden>进入首页　↗</button></section>
<aside class="art" aria-hidden="true"><div class="sample">Qwen-Image-2.1　/　本地生成样张</div><div class="frame"></div><div class="screen"><img src="docs/images/index.png" alt=""></div><div class="stack"><i></i><i></i><i></i></div></aside></main>
<footer><div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div><nav><button id="back">返回</button><button id="next">下一步</button></nav></footer>
<script>
const preview=location.protocol==='file:';
const legacyPreview=preview && ['gallery','system'].includes(new URLSearchParams(location.search).get('design'));
const pages=[
 ['欢迎使用 LuminaUI','你的本地图像工作室。'],
 ['从描述到作品','写下画面描述，选择画幅，用 Qwen-Image-2.1 生成图像。'],
 ['在你的电脑上运行','LuminaUI 使用本机 NVIDIA GPU 生成图像，作品保存在安装目录的输出文件夹中。'],
 ['准备本地资源','首次准备需联网，请预留 40 GB 磁盘空间。'],
 ['选择工作室外观','为首页和工作台选择浅色、深色，或跟随系统。']
];
const $=id=>document.getElementById(id);
let page=preview && location.hash==='#setup' ? 3 : 0,busy=false,ready=false,poll,sim=0;
if(preview)$('edition').textContent='界面预览 · 模拟资源准备';
let shown=-1;
function render(){
 const changed=shown!==page, direction=page>=shown?1:-1;shown=page;
 $('chapter').textContent=['欢迎使用','构图体验','输出库','首次准备',''][page];
 if(legacyPreview && changed && !matchMedia('(prefers-reduced-motion: reduce)').matches){
   for(const [i,id] of ['chapter','title','copy'].entries()){
     const el=$(id);el.getAnimations().forEach(a=>a.cancel());
     el.animate([{opacity:0,transform:'translateY('+direction*14+'px)'},{opacity:1,transform:'none'}],{duration:440,delay:i*42,easing:'cubic-bezier(.22,.68,.12,1)',fill:'backwards'});
   }
 }
 $('meter').hidden=!(busy&&page===3);
 document.body.dataset.page=page;$('title').innerText=pages[page][0];$('copy').textContent=pages[page][1];
 $('resources').hidden=page!==3;$('enter').hidden=page<4;$('next').hidden=page>=4;$('back').hidden=page===0||page>=4||busy;
 $('next').textContent=page===3?(ready?'个性化设置':busy?'正在准备…':preview?'预览下载过程':'下载并安装'):'下一步';$('next').disabled=busy;
 if(page===3 && ready){$('title').textContent='准备完成';$('copy').textContent='资源已校验，本地引擎已连接。';$('back').hidden=true;$('notice').textContent='';}
 document.querySelectorAll('.dots i').forEach((dot,i)=>{dot.classList.toggle('on',i<=page);dot.classList.toggle('current',i===page)});
 if(page!==3)$('notice').textContent='';
 window.dispatchEvent(new Event('intro-render'));
}
async function api(path,method='GET'){
 const r=await fetch(path,{method,headers:{'X-Lumina-Setup':'1'},cache:'no-store'});
 if(!r.ok)throw Error('首次启动服务未响应，请重新打开 LuminaUI。');return r.json();
}
const phases={runtime:'检查或下载 Windows 运行包…',extract:'正在安装 Python、PyTorch 和 ComfyUI…',cuda:'正在检查 NVIDIA GPU 和 Python 依赖…',engine:'正在加载内置工作流，核验引擎并连接工作台…'};
async function monitor(){
 try{
 const state=preview?(++sim>7?{state:'ready'}:{state:'working',phase:['runtime','extract','cuda','diffusion_models/Qwen-Image-2.1','diffusion_models/Qwen-Image-2.1','diffusion_models/Qwen-Image-2.1','engine'][sim-1],...((sim>=4&&sim<=6)?{bytes:(sim-4)*3500000000,total:7256783064}:{})}):await api('status');
 window.dispatchEvent(new CustomEvent('intro-progress',{detail:state}));
 if(state.state==='ready'){busy=false;ready=true;page=legacyPreview?4:3;render();$(legacyPreview?'enter':'next').focus();return;}
 if(state.state==='failed')throw Error(state.message||'准备失败，请检查网络、驱动和剩余磁盘空间后重试。');
 $('notice').textContent=phases[state.phase]||(state.phase?'正在下载或校验 '+state.phase.split('/').pop():'正在启动资源检查…');
 if(state.total){$('meter').max=state.total;$('meter').value=state.bytes||0;}else $('meter').removeAttribute('value');
 if(state.total && state.bytes>0)$('notice').textContent+='　'+(state.bytes/1e9).toFixed(2)+' / '+(state.total/1e9).toFixed(2)+' GB';
 poll=setTimeout(monitor,preview?600:1200);
 }catch(e){busy=false;render();$('notice').textContent=e.message;$('next').textContent='重新检查';}
}
$('next').onclick=async()=>{
 if(page<3){page++;render();return;}
 if(page===3 && ready){page=4;render();document.querySelector('[name="appearance"]:checked').focus();return;}
 busy=true;render();try{if(!preview)await api('prepare','POST');sim=0;await monitor();}
 catch(e){busy=false;render();$('notice').textContent=e.message;}
};
$('back').onclick=()=>{if(!busy&&page>0){page--;render();}};
$('enter').onclick=async()=>{
 $('enter').disabled=true;
 const appearance=document.querySelector('[name="appearance"]:checked')?.value || 'dark';
 try{if(!preview)await api('finish?appearance='+appearance,'POST');document.body.classList.add('leaving');
 setTimeout(()=>location.replace(preview?'desktop/web-preview/home.html?appearance='+appearance:'http://127.0.0.1:18290/'),matchMedia('(prefers-reduced-motion: reduce)').matches?0:560);
 }catch(e){$('enter').disabled=false;$('notice').textContent=e.message;}
};
render();
if(!preview)api('status').then(s=>{if(s.state!=='idle'){page=3;busy=true;render();monitor();}}).catch(e=>{$('notice').textContent=e.message;});
</script><script>
if(legacyPreview){
 const style=document.createElement('link');style.rel='stylesheet';style.href='design-preview.css';document.head.append(style);
 const script=document.createElement('script');script.src='design-preview.js';document.body.append(script);
}
</script><script src="canvas-intro.js"></script></body></html>
